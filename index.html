/* ═══ HUNTER VS FOUR · a Multiplayer Agent starter ════════════════════════════════════

 *                   bumping into things; paths for bots; line of sight

 *   NIGHT (HOST) .. brief → hunt → over: picking the hunter, repairs, catches, the cage,
 *                   the gates, escapes, points. Only the host writes these.
 *   BOTS .......... bot survivors repair, flee, rescue and run for the gate; a bot hunter
 *                   patrols, listens and chases (the same brain drives you in ?attract)
 *   ME ............ walking, running, lunging. Each player writes only its own.
 *   HUD & RESULTS . generators, timer, your role, hints, results card, leaderboard
 *   INPUT & SOUND . keyboard, mouse, touch stick and buttons, WebAudio effects
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code):
 *   - Each player writes its OWN entity: `p` (one packed JSON field: night id, position,
 *     facing, what it's doing: still, walking, running, lunging) about 12 times a second,
 *     `hb` (heartbeat) once a second, and `n`/`c` (name, color) once.
 *   - The HOST is the lowest sessionId among live players (heartbeat seen in the last 3s),
 *     worked out every frame. Only the host writes the shared fields `game` (id, v, phase,
 *     timers, who hunts, generator progress, who is caged, who escaped, rescues, points,
 *     the winner) and `bots` (every bot's position, ~10 times a second). A new host adopts
 *     both and carries on.
 *   - No intents needed for play: repairing (standing still at a generator), opening the
 *     cage (standing at it), catching (the hunter touching you) and escaping (walking out
 *     of an open gate) are all decided by the host from everyone's latest position.
 *     The only intent is "again" (start the next night sooner from the results card).
 *   - A new night starts only when the host bumps game.id; every client then goes back
 *     to its start spot.
 *   - NOT SECRET: the hunter's screen only draws survivors it can see (or hear running),

// Other players and (on non-hosts) bots arrive ~10–12 times a second; they're drawn LAG ms in the
// past, between the two updates around that moment, so they glide instead of stepping.
const LAG = 150, tracks = new Map();
function feed(id, raw, s, now) {
  let tr = tracks.get(id);
  if (!tr) { tr = { raw: null, buf: [] }; tracks.set(id, tr); }
  if (tr.raw === raw) return tr;
  tr.raw = raw;
  const last = tr.buf[tr.buf.length - 1];
  if (last && Math.hypot(last.x - s.x, last.z - s.z) > 5) tr.buf.length = 0; // a jump (caged, a new night): no sliding across the yard
  tr.buf.push({ at: now, x: s.x, z: s.z, h: s.h, a: s.a || 0 });
  if (tr.buf.length > 10) tr.buf.shift();
  return tr;
}
function sample(tr, now) {
  const b = tr.buf, t = now - LAG;
  if (b.length === 1 || t <= b[0].at) return b[0];
  for (let i = b.length - 1; i > 0; i--) {
    if (b[i - 1].at > t) continue;
    const p = b[i - 1], q = b[i];
    if (t >= q.at) return q;
    const k = (t - p.at) / Math.max(1, q.at - p.at);
    return { x: p.x + (q.x - p.x) * k, z: p.z + (q.z - p.z) * k, h: p.h + angDiff(q.h, p.h) * k, a: q.a };
  }
  return b[b.length - 1];
}
function drawPeople(g, all, now, t, dt) {
  const seen = new Set(), iHunt = isHunter(net.sessionId, g), raw = S.shared.bots;
  for (const c of all) {
    const s = c.mine ? me : c.bot && isHost() ? c : sample(feed(c.id, c.bot ? raw : S.entities.players[c.id].p, c, now), now);
    const hunter = isHunter(c.id, g), v = viewOf(c.id, hunter, c.color, c.mine ? "" : c.name);
    seen.add(c.id);
    // The hunter's screen only shows survivors it can see (and caged ones); running ones leave footprints.
    const hidden = g.out[c.id] || g.lost[c.id] || (iHunt && !hunter && !g.cage[c.id] && g.phase !== "over" && !(dist(me, s) < CONFIG.hunterSight && canSee(me, s)));
    v.g.visible = !hidden;
    if (iHunt && !hunter && s.a === 2 && !g.cage[c.id] && dist(me, s) < CONFIG.hearRun && now - (v.lastPrint || 0) > 250) { v.lastPrint = now; footprint(s.x, s.z); }
    if (hidden) continue;
    v.g.position.set(s.x, 0, s.z); v.g.rotation.y = s.h;
    if (hunter) { v.body.position.y = Math.abs(Math.sin(t * (s.a ? 7 : 2))) * 0.08; v.body.rotation.x = s.a === 4 ? 0.4 : 0; v.haze.material.opacity = 0.45 + 0.15 * Math.sin(t * 5); }
    else poseSurvivor(v, s.a, !!g.cage[c.id], t);
    if (s.a === 3 && Math.random() < dt * 6) { const gp = GENS.find((p) => dist(p, s) < CONFIG.repairReach + 0.1); if (gp) burst(gp.x, 1.2, gp.z, "#ffd36b", 1, 3); }
  }
  for (const [id, v] of views) if (!seen.has(id)) { scene.remove(v.g); views.delete(id); tracks.delete(id); }
  // fear: a red edge and a heartbeat when the hunter is close to a survivor (you)
  const H = all.find((c) => isHunter(c.id, g)), Hv = H && views.get(H.id);
  const danger = !iHunt && Hv && g.phase === "hunt" && inPlay(net.sessionId, g) ? Math.max(0, 1 - dist(Hv.g.position, me) / CONFIG.terror) : 0;
  $("fear").style.opacity = ATTRACT ? 0 : g.cage[net.sessionId] && g.phase === "hunt" ? 0.35 : danger;
  if (danger > 0.1 && now > nextBeat) { nextBeat = now + 1100 - 700 * danger; sound("beat"); }
}
function drawYard(g, t, dt) {
  const td = Date.now();
  GENS.forEach((gp, i) => {
    const v = gens[i], p = g.gens[i] / 100, done = p >= 1;
    if (v.shown !== g.gens[i]) { v.shown = g.gens[i]; v.ring.geometry = progressRing(p); v.ring.visible = p > 0 && !done; v.bulb.material.color.set(done ? "#fff3b0" : "#3a3320"); }
    v.light.intensity = done ? 9 : 0;
    v.beacon.material.color.set(done ? "#fff3b0" : "#ff9a3a"); v.beacon.material.opacity = done ? 0.9 : 0.35 + 0.25 * Math.sin(t * 3 + i); v.beacon.scale.setScalar(done ? 2.6 : 1.6);
    v.body.position.x = !done && p > 0 && Math.random() < 0.5 ? (Math.random() - 0.5) * 0.04 : 0; // rattles while someone fixes it
  });
  cageRing.visible = !!g.fr; if (g.fr) cageRing.geometry = progressRing(Math.min(1, (td - g.fr[0]) / CONFIG.rescueMs));
  cageLight.intensity = Object.keys(g.cage).length ? 5 + Math.sin(t * 6) * 1.5 : 2;
  const open = gatesOpen(g);
  for (const gt of gates) { gt.bars.position.y += ((open ? WALL_H - 0.2 : 0) - gt.bars.position.y) * Math.min(1, dt * 1.5); gt.light.color.set(open ? "#5dff8a" : "#ff4433"); gt.light.intensity = open ? 7 : 2.5; }
  sky.intensity = CONFIG.ambient + g.gens.filter((p) => p >= 100).length * 0.12; // every generator brightens the night
}
/** High and behind you (higher on a tall phone). ?attract watches the hunter and whoever it's after. */
function moveCamera(g, all, dt) {
  let fx = me.x, fz = me.z;
  if (ATTRACT) {
    const H = all.find((c) => isHunter(c.id, g));
    if (H) { const prey = all.filter((c) => !isHunter(c.id, g) && inPlay(c.id, g) && dist(c, H) < 8).sort((p, q) => dist(p, H) - dist(q, H))[0]; fx = prey ? H.x + (prey.x - H.x) * 0.4 : H.x; fz = prey ? H.z + (prey.z - H.z) * 0.4 : H.z; }
  }
  const tall = camera.aspect < 1, hgt = ATTRACT ? 10.5 : tall ? 21 : 15, back = ATTRACT ? 8 : 9;
  camGoal.set(fx, 0, fz);
  camLook.lerp(camGoal, 1 - Math.pow(ATTRACT ? 0.1 : 0.002, dt));
  shake = Math.max(0, shake - dt);
  camera.position.set(camLook.x + (Math.random() - 0.5) * shake, hgt, camLook.z + back + (Math.random() - 0.5) * shake);
  camera.lookAt(camLook.x, 0, camLook.z - 0.5);
}

(async function start() {
  net = await connect();
  me.id = net.sessionId;
  net.onState((st) => { S = st; });
  net.on("again", () => { const g = game(); if (isHost() && g && g.phase === "over") host.again = true; });
  net.onDisconnect(() => { reconnecting = true; $("net").textContent = "Reconnecting…"; });
  net.onReconnect(() => { reconnecting = false; });
  if (!net.offline && typeof MP !== "undefined") board = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }).leaderboard(CONFIG.board);
  const taken = new Set(Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c));
  myColor = COLORS.find((c) => !taken.has(c)) || COLORS[Math.floor(Math.random() * COLORS.length)];
  net.me.set({ n: myName, c: myColor, hb: Date.now() });
  camLook.set(SURV_START.x, 0, SURV_START.z);
  requestAnimationFrame(frame);
})();
</script>
